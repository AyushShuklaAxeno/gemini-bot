name: 'Groq Code Review Bot'
description: 'AI code review with inline PR comments and custom rules support (Groq)'
inputs:
  groq-api-key:
    description: 'Groq API key'
    required: false
    default: ''
  gemini-api-key:
    description: 'Legacy Gemini API key (deprecated, use groq-api-key)'
    required: false
    default: ''
  groq-model:
    description: 'Groq model name'
    required: false
    default: 'llama-3.3-70b-versatile'
  github-token:
    description: 'Token used to post review comments'
    required: false
    default: ${{ github.token }}
  custom-rules-path:
    description: 'Path to custom rules file in consumer repo'
    required: false
    default: 'customRules'
runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    CI_PROVIDER: 'github'
    GROQ_API_KEY: ${{ inputs.groq-api-key || inputs.gemini-api-key }}
    GROQ_MODEL: ${{ inputs.groq-model }}
    GITHUB_TOKEN: ${{ inputs.github-token }}
    CUSTOM_RULES_FILE: ${{ inputs.custom-rules-path }}
