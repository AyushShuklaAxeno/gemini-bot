name: 'AI Code Review Bot'
description: 'AI code review with inline PR comments and custom rules support (OpenRouter)'
inputs:
  openrouter-api-key:
    description: 'OpenRouter API key'
    required: false
    default: ''
  openrouter-model:
    description: 'OpenRouter model name'
    required: false
    default: 'anthropic/claude-3.5-sonnet'
  groq-api-key:
    description: 'Legacy Groq API key (deprecated, use openrouter-api-key)'
    required: false
    default: ''
  gemini-api-key:
    description: 'Legacy Gemini API key (deprecated, use openrouter-api-key)'
    required: false
    default: ''
  github-token:
    description: 'Token used to post review comments'
    required: false
    default: ${{ github.token }}
  custom-rules-path:
    description: 'Path to custom rules file in consumer repo'
    required: false
    default: 'customRules'
runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    CI_PROVIDER: 'github'
    OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key || inputs.groq-api-key || inputs.gemini-api-key }}
    OPENROUTER_MODEL: ${{ inputs.openrouter-model }}
    GITHUB_TOKEN: ${{ inputs.github-token }}
    CUSTOM_RULES_FILE: ${{ inputs.custom-rules-path }}
