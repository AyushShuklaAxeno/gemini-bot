name: 'Gemini Code Review Bot'
description: 'AI code review with inline PR comments and custom rules support (Gemini)'
inputs:
  gemini-api-key:
    description: 'Google Gemini API key'
    required: true
  gemini-model:
    description: 'Gemini model name'
    required: false
    default: 'gemini-2.5-flash'
  github-token:
    description: 'Token used to post review comments'
    required: false
    default: ${{ github.token }}
  custom-rules-path:
    description: 'Path to custom rules file in consumer repo'
    required: false
    default: 'customRules'
runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    CI_PROVIDER: 'github'
    GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
    GEMINI_MODEL: ${{ inputs.gemini-model }}
    GITHUB_TOKEN: ${{ inputs.github-token }}
    CUSTOM_RULES_FILE: ${{ inputs.custom-rules-path }}