# Put this file in the REPO YOU WANT REVIEWED at .github/workflows/ai-review.yml
name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # required to post inline review comments

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for the base...head diff

      - uses: YOUR_GITHUB_USER_OR_ORG/YOUR_NEW_REPO@v1
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          # openrouter-model: anthropic/claude-3.5-sonnet   # optional (e.g. deepseek/deepseek-chat, google/gemini-2.0-flash-001)
          # custom-rules-path: customRules                 # optional
