# Put this file in the REPO YOU WANT REVIEWED at .github/workflows/ai-review.yml
name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # required to post inline review comments

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for the base...head diff

      - uses: YOUR_GITHUB_USER_OR_ORG/YOUR_NEW_REPO@v1
        with:
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          # groq-model: llama-3.3-70b-versatile        # optional
          # custom-rules-path: customRules             # optional
